services:
  - type: web
    name: intern-tracker
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 2 --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DB_PATH
        value: /data/tracker.db
    disk:
      name: intern-tracker-db
      mountPath: /data
      sizeGB: 1
