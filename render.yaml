databases:
  - name: intern-tracker-db
    databaseName: intern_tracker
    user: intern_user
    plan: free

services:
  - type: web
    name: intern-tracker
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 2 --bind 0.0.0.0:$PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: intern-tracker-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.12.0
